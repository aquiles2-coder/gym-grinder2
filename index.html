<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Grinder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="game">
    <header>
      <div id="header-bar" class="header-bar" style="display: none;">
        <button id="profile-btn" class="header-box tab-btn" data-tab="profile">👤 Profile</button>
        <button class="header-box tab-btn" data-tab="builder">Create your train</button>
        <button id="logout-btn" class="header-box header-logout">Logout</button>
      </div>
      <h1>🏋️ Gym Grinder</h1>
    </header>

    <div id="offline-section" class="stats">
      <h2>Temporarily offline</h2>
      <p>Gym Grinder is taken down for a short time.<br>
      Come back later.</p>
    </div>

    <div id="auth-section" style="display: none;">
      <button id="login-btn">Login</button>
      <button id="register-btn">Register</button>
    </div>

    <div id="pending-section" style="display: none;" class="stats">
      <h2>⏳ Waiting for Approval</h2>
      <p>Your account has been created but is not yet approved.<br>
      Please wait until the app owner activates your account in Firebase.</p>
    </div>

    <div id="main-game" style="display: none;">
      <!-- Menu boxes -->
      <div class="menu-grid">
        <button class="menu-box tab-btn active" data-tab="workout">Workout</button>
        <button class="menu-box tab-btn" data-tab="cardio">Cardio</button>
        <button class="menu-box tab-btn" data-tab="trains">Personalized Trains</button>
        <button class="menu-box tab-btn" data-tab="history">History</button>
        <button class="menu-box tab-btn" data-tab="weekly">Week Progress</button>
        <button class="menu-box tab-btn" data-tab="leaderboards">Leaderboards</button>
      </div>
    </div>
  </div>
</body>
</html>
